<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TopMusicianGear</title>
  <script>
    var path = window.location.pathname.replace(/\/+$/, '');
    // Handle /guides/something.html -> /?g=something
    var match = path.match(/\/guides\/(.+?)(?:_es)?(?:\.html)?$/);
    if (match) {
      window.location.replace('/?g=' + match[1]);
    } else {
      // Try to extract filename as guide id
      var guide = path.split('/').pop().replace(/\.html$/, '').replace(/_es$/, '');
      if (guide && guide !== '404.html') {
        window.location.replace('/?g=' + guide);
      } else {
        window.location.replace('/');
      }
    }
  </script>
</head>
<body></body>
</html>
